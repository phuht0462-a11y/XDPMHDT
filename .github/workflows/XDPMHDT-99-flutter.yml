name: XDPMHDT-99 Flutter verification
on:
  push:
    branches: ["ci/XDPMHDT-99-flutter-verification"]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Interface
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - name: Resolve dependencies
        id: deps
        run: flutter pub get
      - name: Personalization regression tests
        if: ${{ success() && steps.deps.outcome == 'success' }}
        run: flutter test test/features/personalization/personalization_offline_test.dart test/visit_history_grouping_test.dart test/personalization_screens_test.dart
      - name: Analyze application (report existing project lint)
        continue-on-error: true
        if: ${{ always() && steps.deps.outcome == 'success' }}
        run: flutter analyze
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: always()
        with:
          ref: c6ec6c8f1e66158dd292bc7f7413e3144f15bbf0
          path: baseline
          persist-credentials: false
      - name: Analyze main baseline
        if: ${{ always() && steps.deps.outcome == 'success' }}
        continue-on-error: true
        working-directory: baseline/Interface
        run: |
          flutter pub get
          flutter analyze
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PARALLEL_LIMIT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Start disposable infrastructure
        run: docker compose -f Infra/docker-compose.yml --profile all up -d --wait --wait-timeout 180 mysql-db redis-cache rabbitmq
      - name: Build and start real services
        run: docker compose -f Infra/docker-compose.yml --profile all up -d --no-deps --build --wait --wait-timeout 240 auth-service site-service content-service personalization-service analytics-service api-gateway
      - name: Verify authentication, retries, events and outage fallback
        run: python services/personalization-service/scripts/smoke_live.py --chaos --output /tmp/phu-w7-live-smoke.json
      - name: Show evidence
        if: always()
        run: |
          docker compose -f Infra/docker-compose.yml --profile all ps -a
          test ! -f /tmp/phu-w7-live-smoke.json || cat /tmp/phu-w7-live-smoke.json
      - name: Diagnostics
        if: failure()
        run: docker compose -f Infra/docker-compose.yml --profile all logs --tail 60
      - name: Stop disposable stack
        if: always()
        run: docker compose -f Infra/docker-compose.yml --profile all down
