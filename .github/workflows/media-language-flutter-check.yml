name: Media and language Flutter verification

on:
  push:
    branches:
      - fix/media-language-content-20261128
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Interface
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: All Flutter tests including dynamic language test
        run: flutter test --reporter expanded
      - name: Flutter analyzer (existing repository lint tracked separately)
        continue-on-error: true
        run: flutter analyze

  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Parse demo media repair on Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $script = (Resolve-Path 'Infra/seed/repair-demo-media.ps1').Path
          [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            throw 'PowerShell script syntax invalid'
          }
          Write-Host 'PowerShell 5.1 syntax OK'
