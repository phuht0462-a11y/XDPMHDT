name: Phu W6 Flutter CI
on:
  push:
    branches:
      - feature/phu-w6-mobile-polish
  workflow_dispatch:

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Interface
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter packages
        run: flutter pub get
      - name: Dart syntax and formatter smoke check
        run: dart format --output=none lib/features/visit_history/visit_history_screen.dart lib/features/favorites/favorites_screen.dart lib/features/personalization/personalization_service.dart test/visit_history_grouping_test.dart
      - name: Flutter widget and unit tests
        run: flutter test test/visit_history_grouping_test.dart test/personalization_screens_test.dart
