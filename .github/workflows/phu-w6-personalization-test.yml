name: Phu W6 Personalization CI
on:
  push:
    branches:
      - feature/phu-w6-events
  workflow_dispatch:

jobs:
  personalization-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven unit tests
        run: mvn -B -pl services/personalization-service -am test
      - name: Package personalization-service
        run: mvn -B -pl services/personalization-service -am -DskipTests package
